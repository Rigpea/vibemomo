  <script>
    // Apply the theme before first paint (session > studio default handled in app.js; this avoids a flash).
    try { var l = JSON.parse(sessionStorage.getItem('atelier.layout') || '{}'); if (l.theme) document.documentElement.dataset.theme = l.theme; } catch (e) {}
    // The look last applied (Settings, Appearance), so the first frame has it too; app.js applies the stored one once the state arrives.
    try {
      var a = JSON.parse(localStorage.getItem('atelier.appearance') || 'null'), r = document.documentElement, v = (a && a[r.dataset.theme]) || {};
      for (var k in v) if (/^--[a-z0-9-]+$/.test(k)) r.style.setProperty(k, String(v[k]));
      if (a && a.motion) r.dataset.motion = 'reduced';
    } catch (e) {}
  </script>
</head>
